name: build

on:
  push:
    branches:
      - json
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # This ensures we get full git history

      - name: convert to binary
        run: |
          wget https://github.com/Its-MyPic/Its-MyPic-Proto-Convert/releases/latest/download/Its-MyPic-Proto-Convert
          chmod +x Its-MyPic-Proto-Convert
          cat ./data.json | ./Its-MyPic-Proto-Convert > /tmp/data.bin
          rm Its-MyPic-Proto-Convert

      - name: Setup Git and Push to Proto Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get current commit hash
          SOURCE_COMMIT=$(git rev-parse HEAD)

          # Create or switch to proto branch
          git checkout proto

          # Restore data.bin from temp
          mv /tmp/data.bin ./

          # Add and commit the binary file
          git add data.bin
          git commit -m "chore: protobuf binary files from ${SOURCE_COMMIT}"

          # Force push with token authentication
          git push -f "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" proto
