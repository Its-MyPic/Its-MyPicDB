<body>
  [{"data":[]}]
</body>
<script>
  function normalize(str) {
    return str
      .toLowerCase()
      .replace("你", "妳")
      .replace("阿", "啊")
      .replace("他", "她")
      .replace("？", "?")
      .replace("！", "!")
      .replace("：", ":")
      .replace("，", ",");
  }

  var query = decodeURIComponent(location.search.split("=")[1]);
  var query = normalize(query);
  var xhr = new XMLHttpRequest();
  xhr.open(
    "GET",
    "https://raw.githubusercontent.com/Its-MyPic/Its-MyPicDB/refs/heads/json/data.json",
    false
  );
  xhr.send();

  if (xhr.status === 200) {
    var data = JSON.parse(xhr.responseText);
    var result = {
      data: data.filter(function (item) {
        return normalize(item.text).includes(query);
      }),
    };
    document.body.textContent = JSON.stringify(result);
  } else {
    document.body.textContent = "[]";
  }
</script>
